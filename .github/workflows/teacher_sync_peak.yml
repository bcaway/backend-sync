name: BCA Teacher Absence Sync (Peak Continuous)

on:
  schedule:
    # Start of weekday peak window (11:00 UTC).
    - cron: '0 11 * * 1-5'

  workflow_dispatch:
    inputs:
      interval:
        description: 'Continuous polling interval in seconds'
        required: false
        default: '60'
        type: string
      force:
        description: 'Force push to Supabase (bypass hash check on first cycle)'
        required: false
        default: false
        type: boolean

concurrency:
  group: teacher-sync-peak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Absences (Peak Continuous)
    runs-on: ubuntu-latest
    timeout-minutes: 165

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Restore Chrome session state from secrets
        env:
          CHROME_STATE_JSON: ${{ secrets.CHROME_STATE_JSON }}
        run: |
          if [ -z "$CHROME_STATE_JSON" ]; then
            echo "::error::CHROME_STATE_JSON secret is empty or missing! Run capture_session.py locally and set repository secret."
            exit 1
          fi
          printf '%s' "$CHROME_STATE_JSON" > chrome_state.json

      - name: Run absence sync engine (continuous peak mode)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          GOOGLE_DOC_URL: ${{ secrets.GOOGLE_DOC_URL || 'https://docs.google.com/document/d/e/2PACX-1vRkhySmwAiTtY88tcshckpV4F0vRrULccaGrYl_Sf2ubWpyyXA4l8c-KAOuMzSwFe-qyAQhLqXzVsbA/pub' }}
          INPUT_INTERVAL: ${{ inputs.interval }}
        run: |
          INTERVAL_SECONDS="${INPUT_INTERVAL:-60}"
          EXTRA_ARGS="--continuous --interval ${INTERVAL_SECONDS}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi

          echo "Executing: python sync_monitor.py $EXTRA_ARGS"
          python sync_monitor.py $EXTRA_ARGS

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-peak-${{ github.run_id }}
          path: |
            .debug/
            debug_last_page.html
            debug_last_response.json
          if-no-files-found: ignore
          retention-days: 5
