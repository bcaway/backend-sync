name: BCA Teacher Absence Sync Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health-check:
    name: Check workflow cadence
    runs-on: ubuntu-latest
    steps:
      - name: Validate expected run cadence
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const nowMs = now.getTime();

            const offPeakWorkflow = 'teacher_sync_offpeak.yml';
            const peakWorkflow = 'teacher_sync_peak.yml';

            const listRuns = async (workflowId) => {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                per_page: 50,
              });
              return (response.data.workflow_runs || []).filter(
                (run) => run.event === 'schedule' || run.event === 'workflow_dispatch'
              );
            };

            const [offPeakRuns, peakRuns] = await Promise.all([
              listRuns(offPeakWorkflow),
              listRuns(peakWorkflow),
            ]);

            const minsSince = (isoTime) => (nowMs - new Date(isoTime).getTime()) / 60000;
            const utcDay = now.getUTCDay(); // 0=Sun..6=Sat
            const utcMinuteOfDay = now.getUTCHours() * 60 + now.getUTCMinutes();
            const isWeekday = utcDay >= 1 && utcDay <= 5;
            const inPeakWindow = isWeekday && utcMinuteOfDay >= 660 && utcMinuteOfDay < 810; // 11:00-13:30 UTC

            const problems = [];
            const notes = [];

            if (inPeakWindow) {
              const peakInProgress = peakRuns.some((run) => run.status === 'in_progress');
              const peakRecent = peakRuns.filter((run) => minsSince(run.created_at) <= 180);

              notes.push(`Peak window: true, peak in-progress runs: ${peakRuns.filter((run) => run.status === 'in_progress').length}, peak runs in last 180m: ${peakRecent.length}`);

              if (!peakInProgress) {
                problems.push('Expected an in-progress peak continuous run during 11:00-13:30 UTC, but none was found.');
              }
            } else {
              const recentOffPeak = offPeakRuns.filter((run) => minsSince(run.created_at) <= 35);
              notes.push(`Peak window: false, off-peak runs in last 35m: ${recentOffPeak.length}`);

              if (recentOffPeak.length < 2) {
                problems.push('Expected at least 2 off-peak scheduled runs in the last 35 minutes, but found fewer.');
              }
            }

            core.info(`Health check context: ${notes.join(' | ')}`);

            if (problems.length > 0) {
              core.setFailed(problems.join(' '));
            }
